<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lava Jato Pro</title>
<style>
:root{--bg:#0b1220;--panel:#0f172a;--panel2:#111827;--border:#334155;--text:#f8fafc;--muted:#94a3b8;--accent:#f97316;--danger:#ef4444}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}.app{display:flex;min-height:100vh}.side{width:230px;position:fixed;inset:0 auto 0 0;background:#090f1c;border-right:1px solid var(--border);padding:22px 16px}.brand{font-size:24px;font-weight:800;margin-bottom:28px}.brand span{color:var(--accent)}nav button{width:100%;border:0;background:transparent;color:#cbd5e1;padding:12px 14px;text-align:left;border-radius:10px;margin:4px 0;font-size:15px;cursor:pointer}nav button.active,nav button:hover{background:#1e293b;color:#fff}.main{margin-left:230px;width:calc(100% - 230px);padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0}.muted{color:var(--muted)}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#1e293b;color:#fff}.danger{background:var(--danger);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card,.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--border);border-radius:16px;padding:18px}.metric{font-size:30px;font-weight:800;margin-top:8px}.panel{margin-top:18px}.section{display:none}.section.active{display:block}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.quick button{padding:16px;border-radius:14px;border:1px solid var(--border);background:var(--panel2);color:#fff;text-align:left;cursor:pointer}.quick b{display:block;margin-bottom:5px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #243041;font-size:14px}th{color:#cbd5e1}.badge{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;display:inline-block}.wait{background:#78350f;color:#fde68a}.run{background:#1e3a8a;color:#bfdbfe}.done{background:#14532d;color:#bbf7d0}.actions{display:flex;gap:8px;flex-wrap:wrap}.modal{display:none;position:fixed;inset:0;background:#000a;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.open{display:flex}.box{width:min(720px,96vw);max-height:92vh;overflow:auto;background:var(--panel2);border:1px solid var(--border);border-radius:16px;padding:20px}.head{display:flex;justify-content:space-between;align-items:center}.close{background:transparent;border:0;color:#fff;font-size:26px;cursor:pointer}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}input,select,textarea{width:100%;padding:11px;background:var(--bg);color:#fff;border:1px solid var(--border);border-radius:10px}label{display:block;font-size:13px;color:#cbd5e1;margin-bottom:6px}.empty{text-align:center;padding:24px;color:var(--muted)}@media(max-width:900px){.side{width:76px}.brand{font-size:0}.brand:after{content:'LJ';font-size:22px;color:var(--accent);font-weight:900}nav button{font-size:0;text-align:center}nav button:before{font-size:20px}nav button[data-p=dashboard]:before{content:'⌂'}nav button[data-p=ordens]:before{content:'▣'}nav button[data-p=clientes]:before{content:'♟'}nav button[data-p=caixa]:before{content:'$'}.main{margin-left:76px;width:calc(100% - 76px);padding:16px}.grid,.quick{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid,.quick,.form{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}table{display:block;overflow-x:auto}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">Lava <span>Jato</span> Pro</div><nav><button class="active" data-p="dashboard">Dashboard</button><button data-p="ordens">Ordens de Serviço</button><button data-p="clientes">Clientes</button><button data-p="caixa">Caixa</button></nav></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><small class="muted" id="today"></small></div><button class="btn primary" onclick="openOrder()">+ Nova Ordem</button></div>
<section id="dashboard" class="section active"><div class="grid"><div class="card"><div class="muted">Veículos hoje</div><div class="metric" id="kCars">0</div></div><div class="card"><div class="muted">Em atendimento</div><div class="metric" id="kOpen">0</div></div><div class="card"><div class="muted">Finalizados</div><div class="metric" id="kDone">0</div></div><div class="card"><div class="muted">Faturamento</div><div class="metric" id="kRevenue">R$ 0,00</div></div></div><div class="quick"><button onclick="openOrder()"><b>Nova Ordem</b><span class="muted">Registrar veículo e serviço</span></button><button onclick="openClient()"><b>Novo Cliente</b><span class="muted">Cadastro rápido</span></button><button onclick="show('ordens')"><b>Ver Fila</b><span class="muted">Acompanhar serviços</span></button><button onclick="show('caixa')"><b>Caixa</b><span class="muted">Recebimentos do dia</span></button></div><div class="panel"><h3>Serviços em andamento</h3><div id="dashOrders"></div></div></section>
<section id="ordens" class="section"><div class="panel"><div class="actions" style="justify-content:space-between;align-items:center"><h3>Ordens de Serviço</h3><button class="btn primary" onclick="openOrder()">+ Nova Ordem</button></div><div id="orders"></div></div></section>
<section id="clientes" class="section"><div class="panel"><div class="actions" style="justify-content:space-between;align-items:center"><h3>Clientes</h3><button class="btn primary" onclick="openClient()">+ Novo Cliente</button></div><div id="clients"></div></div></section>
<section id="caixa" class="section"><div class="grid"><div class="card"><div class="muted">Recebido hoje</div><div class="metric" id="cashAll">R$ 0,00</div></div><div class="card"><div class="muted">PIX</div><div class="metric" id="cashPix">R$ 0,00</div></div><div class="card"><div class="muted">Dinheiro</div><div class="metric" id="cashMoney">R$ 0,00</div></div><div class="card"><div class="muted">Cartão</div><div class="metric" id="cashCard">R$ 0,00</div></div></div><div class="panel"><h3>Recebimentos</h3><div id="cashTable"></div></div></section></main></div>
<div class="modal" id="orderModal"><div class="box"><div class="head"><h3>Nova Ordem de Serviço</h3><button class="close" onclick="closeM('orderModal')">×</button></div><div class="form"><div><label>Cliente</label><input id="oClient"></div><div><label>Telefone</label><input id="oPhone"></div><div><label>Placa</label><input id="oPlate"></div><div><label>Veículo</label><input id="oCar"></div><div><label>Serviço</label><select id="oService"><option>Lavagem Simples</option><option>Lavagem Completa</option><option>Lavagem + Cera</option><option>Higienização</option><option>Polimento</option></select></div><div><label>Valor (R$)</label><input id="oValue" type="number" value="40"></div><div><label>Status</label><select id="oStatus"><option>Aguardando</option><option>Em atendimento</option><option>Finalizado</option></select></div><div><label>Pagamento</label><select id="oPayment"><option>PIX</option><option>Dinheiro</option><option>Cartão</option></select></div></div><div style="margin-top:12px"><label>Observações</label><textarea id="oNotes"></textarea></div><div class="actions" style="justify-content:flex-end;margin-top:16px"><button class="btn secondary" onclick="closeM('orderModal')">Cancelar</button><button class="btn primary" onclick="saveOrder()">Salvar Ordem</button></div></div></div>
<div class="modal" id="clientModal"><div class="box"><div class="head"><h3>Novo Cliente</h3><button class="close" onclick="closeM('clientModal')">×</button></div><div class="form"><div><label>Nome</label><input id="cName"></div><div><label>Telefone</label><input id="cPhone"></div><div><label>Placa</label><input id="cPlate"></div><div><label>Veículo</label><input id="cCar"></div></div><div class="actions" style="justify-content:flex-end;margin-top:16px"><button class="btn secondary" onclick="closeM('clientModal')">Cancelar</button><button class="btn primary" onclick="saveClient()">Salvar Cliente</button></div></div></div>
<script>
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),day=()=>new Date().toISOString().slice(0,10),load=(k,d=[])=>JSON.parse(localStorage.getItem(k)||JSON.stringify(d)),save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));if(!localStorage.getItem('lj_orders'))save('lj_orders',[{id:1001,date:day(),client:'Carlos Silva',phone:'(81) 99999-1234',plate:'QYZ4A21',car:'HB20',service:'Lavagem Completa',value:60,status:'Em atendimento',payment:'PIX'},{id:1002,date:day(),client:'Mariana Alves',phone:'(81) 98888-4321',plate:'PCE7B11',car:'Onix',service:'Lavagem Simples',value:40,status:'Finalizado',payment:'Cartão'}]);if(!localStorage.getItem('lj_clients'))save('lj_clients',[{id:1,name:'Carlos Silva',phone:'(81) 99999-1234',plate:'QYZ4A21',car:'HB20'},{id:2,name:'Mariana Alves',phone:'(81) 98888-4321',plate:'PCE7B11',car:'Onix'}]);today.textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.p));function show(p){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active');document.querySelector(`[data-p="${p}"]`).classList.add('active');title.textContent={dashboard:'Dashboard',ordens:'Ordens de Serviço',clientes:'Clientes',caixa:'Caixa'}[p];render()}function openOrder(){orderModal.classList.add('open')}function openClient(){clientModal.classList.add('open')}function closeM(id){document.getElementById(id).classList.remove('open')}function saveOrder(){let client=oClient.value.trim(),plate=oPlate.value.trim().toUpperCase();if(!client||!plate)return alert('Informe cliente e placa.');let a=load('lj_orders'),o={id:(a.length?Math.max(...a.map(x=>x.id)):1000)+1,date:day(),client,phone:oPhone.value.trim(),plate,car:oCar.value.trim(),service:oService.value,value:+oValue.value||0,status:oStatus.value,payment:oPayment.value,notes:oNotes.value.trim()};a.push(o);save('lj_orders',a);let c=load('lj_clients');if(!c.some(x=>x.plate===plate)){c.push({id:Date.now(),name:client,phone:o.phone,plate,car:o.car});save('lj_clients',c)}closeM('orderModal');render();show('ordens')}function saveClient(){let name=cName.value.trim();if(!name)return alert('Informe o nome.');let c=load('lj_clients');c.push({id:Date.now(),name,phone:cPhone.value.trim(),plate:cPlate.value.trim().toUpperCase(),car:cCar.value.trim()});save('lj_clients',c);closeM('clientModal');render()}function setStatus(id,s){save('lj_orders',load('lj_orders').map(o=>o.id===id?{...o,status:s}:o));render()}function delOrder(id){if(confirm('Excluir esta ordem?')){save('lj_orders',load('lj_orders').filter(o=>o.id!==id));render()}}function badge(s){return `<span class="badge ${s==='Finalizado'?'done':s==='Em atendimento'?'run':'wait'}">${s}</span>`}function render(){let a=load('lj_orders'),c=load('lj_clients'),t=a.filter(o=>o.date===day()),done=t.filter(o=>o.status==='Finalizado'),open=t.filter(o=>o.status!=='Finalizado'),rev=done.reduce((s,o)=>s+(+o.value||0),0);kCars.textContent=t.length;kOpen.textContent=open.length;kDone.textContent=done.length;kRevenue.textContent=money(rev);dashOrders.innerHTML=open.length?`<table><thead><tr><th>OS</th><th>Cliente</th><th>Placa</th><th>Serviço</th><th>Status</th></tr></thead><tbody>${open.map(o=>`<tr><td>#${o.id}</td><td>${o.client}</td><td>${o.plate}</td><td>${o.service}</td><td>${badge(o.status)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum veículo em atendimento.</div>';orders.innerHTML=a.length?`<table><thead><tr><th>OS</th><th>Cliente</th><th>Veículo</th><th>Serviço</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead><tbody>${a.slice().reverse().map(o=>`<tr><td>#${o.id}</td><td>${o.client}<br><span class="muted">${o.phone||''}</span></td><td>${o.plate}<br><span class="muted">${o.car||''}</span></td><td>${o.service}</td><td>${money(o.value)}</td><td>${badge(o.status)}</td><td><div class="actions">${o.status!=='Em atendimento'?`<button class="btn secondary" onclick="setStatus(${o.id},'Em atendimento')">Iniciar</button>`:''}${o.status!=='Finalizado'?`<button class="btn primary" onclick="setStatus(${o.id},'Finalizado')">Finalizar</button>`:''}<button class="btn danger" onclick="delOrder(${o.id})">Excluir</button></div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhuma ordem cadastrada.</div>';clients.innerHTML=c.length?`<table><thead><tr><th>Nome</th><th>Telefone</th><th>Placa</th><th>Veículo</th></tr></thead><tbody>${c.slice().reverse().map(x=>`<tr><td>${x.name}</td><td>${x.phone||''}</td><td>${x.plate||''}</td><td>${x.car||''}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum cliente cadastrado.</div>';let pix=done.filter(o=>o.payment==='PIX').reduce((s,o)=>s+o.value,0),din=done.filter(o=>o.payment==='Dinheiro').reduce((s,o)=>s+o.value,0),card=done.filter(o=>o.payment==='Cartão').reduce((s,o)=>s+o.value,0);cashAll.textContent=money(rev);cashPix.textContent=money(pix);cashMoney.textContent=money(din);cashCard.textContent=money(card);cashTable.innerHTML=done.length?`<table><thead><tr><th>OS</th><th>Cliente</th><th>Pagamento</th><th>Valor</th></tr></thead><tbody>${done.map(o=>`<tr><td>#${o.id}</td><td>${o.client}</td><td>${o.payment}</td><td>${money(o.value)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum recebimento finalizado hoje.</div>'}render();
</script></body></html>
